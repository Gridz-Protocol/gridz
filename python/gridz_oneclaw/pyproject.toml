[project]
name = "gridz-oneclaw"
version = "0.1.0"
description = "Optional 1claw HSM adapter (Python)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["gridz"]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0"]

[tool.uv.sources]
gridz = { path = "../gridz", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridz_oneclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gridz_oneclaw --cov-report=term-missing --cov-fail-under=85"
